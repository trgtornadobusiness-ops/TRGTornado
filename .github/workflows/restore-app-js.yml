name: Restore app.js
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restore:
    if: github.sha != '48986ba6d778a68fb9504a00a474645f2e08a738'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore known-good app.js
        run: |
          git checkout 48986ba6d778a68fb9504a00a474645f2e08a738 -- app.js
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js
          git diff --cached --quiet || git commit -m 'Restore app.js from known-good version'
          git push
