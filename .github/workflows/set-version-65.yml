name: Set Website Version 80
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  set-version:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set every page footer to Version 80
        shell: bash
        run: |
          set -euo pipefail
          for file in *.html; do
            [ -f "$file" ] || continue
            sed -i -E 's/(class="site-version">)Version [0-9]+/\1Version 80/g' "$file"
          done
      - name: Commit Version 80 updates
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Set all website footers to Version 80"
          file_pattern: '*.html'
