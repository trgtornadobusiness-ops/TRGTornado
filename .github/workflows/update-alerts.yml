name: Update NWS Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Fetch current NWS alerts
        run: |
          curl --fail --retry 4 --retry-delay 5 \
            -A "TRGTornado Weather Site/1.0 (GitHub Pages)" \
            -H "Accept: application/geo+json, application/json" \
            "https://api.weather.gov/alerts/active?status=actual&message_type=alert,update" \
            -o alerts.json

      - name: Validate alert feed
        run: |
          python - <<'PY'
          import json
          with open("alerts.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          if not isinstance(data, dict) or "features" not in data:
              raise SystemExit("NWS alert response is missing the features array")
          print(f"Fetched {len(data['features'])} active alert features.")
          PY

      - name: Commit updated alerts
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update active NWS alerts"
          file_pattern: alerts.json
