name: Update NWS Alerts

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-alerts:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Fetch current NWS alerts
        run: |
          curl --fail --retry 4 --retry-delay 5 \
            -A "TRGTornado Weather Site/1.0 (GitHub Pages)" \
            -H "Accept: application/geo+json, application/json" \
            "https://api.weather.gov/alerts/active" \
            -o alerts.json

      - name: Validate NWS response
        run: |
          python - <<'PY'
          import json

          with open("alerts.json", "r", encoding="utf-8") as f:
              data = json.load(f)

          if "features" not in data:
              raise SystemExit("NWS response does not contain features")

          print("NWS returned", len(data["features"]), "active alerts")
          PY

      - name: Commit updated alerts
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update active NWS alerts"
          file_pattern: alerts.json
