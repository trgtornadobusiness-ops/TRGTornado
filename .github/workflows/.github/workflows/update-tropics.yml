name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tropics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download tropical outlook images
        run: |
          mkdir -p tropical

          curl -L --fail --silent --show-error \
            "https://www.nhc.noaa.gov/xgtwo/two_atl_2d0.png" \
            -o tropical/atlantic.png

          curl -L --fail --silent --show-error \
            "https://www.nhc.noaa.gov/xgtwo/two_epac_2d0.png" \
            -o tropical/eastern-pacific.png

          if curl -L --fail --silent --show-error \
            "https://www.nhc.noaa.gov/xgtwo/two_cpac_2d0.png" \
            -o tropical/central-pacific.png; then
            echo "Central Pacific outlook updated."
          else
            echo "Central Pacific outlook unavailable; keeping previous image."
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- tropical/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated tropical outlooks
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tropical/
          git commit -m "Update tropical outlooks"
          git push
