name: TRG Site Enhancements
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  inject:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Inject shared site script
        shell: bash
        run: |
          changed=0
          for f in *.html; do
            [ -f "$f" ] || continue
            if ! grep -q 'site-enhancements.js' "$f"; then
              python3 - "$f" <<'PY'
import sys
from pathlib import Path
p=Path(sys.argv[1])
s=p.read_text()
needle='</body>'
if needle in s:
    s=s.replace(needle,'<script src="site-enhancements.js"></script></body>',1)
    p.write_text(s)
PY
              changed=1
            fi
          done
          if [ "$changed" = "1" ]; then
            git config user.name 'TRGTornado Bot'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add '*.html'
            git commit -m 'V68: inject shared site enhancements'
            git push
          else
            echo 'Shared site script already present on all HTML pages.'
          fi
