name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

env:
  NHC_UA: "TRGTornado Weather Site/1.0"

jobs:
  update-tropics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find newest NHC tropical outlook graphics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tropical

          find_latest() {
            local basin="$1" file="$2" output="$3"
            local base="https://www.nhc.noaa.gov/archive/xgtwo/${basin}/"
            local html now candidate
            html="$(curl --location --fail --silent --show-error --retry 5 -A "$NHC_UA" "$base" || true)"
            mapfile -t dirs < <(printf '%s' "$html" | grep -oE 'href="[0-9]{10,12}/"' | grep -oE '[0-9]{10,12}' | sort -nr | head -30)
            for d in "${dirs[@]}"; do
              candidate="${base}${d}/${file}"
              echo "Trying $candidate"
              if curl --location --fail --silent --show-error --retry 3 -A "$NHC_UA" "$candidate" -o "$output.tmp"; then
                if file "$output.tmp" | grep -q 'PNG image' && [ "$(stat -c%s "$output.tmp")" -ge 10000 ]; then
                  mv "$output.tmp" "$output"
                  echo "Saved newest $d -> $output"
                  return 0
                fi
              fi
              rm -f "$output.tmp"
            done
            echo "No valid current product found for $output"
            return 1
          }

          # Use the newest timestamped archive directory rather than NHC /latest/.
          find_latest atl xgtwo_atl_7d0.png tropical/atlantic.png
          find_latest epac xgtwo_pac_7d0.png tropical/eastern-pacific.png

          # CPAC is not always published separately; keep the last valid file if absent.
          if ! find_latest epac xgtwo_cpac_7d0.png tropical/central-pacific.png; then
            echo "No current CPAC graphic found; preserving existing CPAC file."
          fi

      - name: Validate tropical graphics
        shell: bash
        run: |
          set -euo pipefail
          for image in tropical/atlantic.png tropical/eastern-pacific.png; do
            test -s "$image"
            file "$image" | grep -q 'PNG image'
          done
          if [ -f tropical/central-pacific.png ]; then
            file tropical/central-pacific.png | grep -q 'PNG image'
          fi

      - name: Commit updated tropical graphics
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update tropical outlook graphics"
          file_pattern: tropical/*.png
