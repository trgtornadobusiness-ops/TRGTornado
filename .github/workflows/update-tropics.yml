name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  NHC_UA: "TRGTornado Weather Site/1.0"

jobs:
  update-tropics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find current NHC graphics from official product pages
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tropical

          download_from_product_page() {
            local page="$1"
            local filename="$2"
            local output="$3"

            echo "Reading official NHC page: $page"
            local html
            html="$(curl -L --fail --silent --show-error --retry 5 --retry-delay 3 \
              --connect-timeout 15 --max-time 90 -A "$NHC_UA" "$page")"

            local path
            path="$(printf '%s' "$html" | grep -oE '[^"'"' ]*'"$filename"'[^"'"' ]*' | head -n1 || true)"

            if [ -z "$path" ]; then
              echo "Could not find $filename on $page"
              return 1
            fi

            if [[ "$path" == http* ]]; then
              url="$path"
            elif [[ "$path" == /* ]]; then
              url="https://www.nhc.noaa.gov$path"
            else
              url="https://www.nhc.noaa.gov/$path"
            fi

            echo "Current product URL: $url"

            curl -L --fail --silent --show-error --retry 5 --retry-delay 3 \
              --connect-timeout 15 --max-time 90 -A "$NHC_UA" \
              "$url" -o "$output.tmp"

            if ! file "$output.tmp" | grep -q "PNG image"; then
              echo "Downloaded response is not a PNG: $url"
              rm -f "$output.tmp"
              return 1
            fi

            if [ "$(stat -c%s "$output.tmp")" -lt 1000 ]; then
              echo "Downloaded PNG is suspiciously small: $url"
              rm -f "$output.tmp"
              return 1
            fi

            mv "$output.tmp" "$output"
            echo "Saved current outlook: $output"
          }

          # The official product pages point to the current timestamped
          # graphical products. This avoids stale /latest/ archive listings.
          download_from_product_page \
            "https://www.nhc.noaa.gov/gtwo.php?basin=atl" \
            "xgtwo_atl_7d0.png" \
            "tropical/atlantic.png"

          download_from_product_page \
            "https://www.nhc.noaa.gov/gtwo.php?basin=epac" \
            "xgtwo_pac_7d0.png" \
            "tropical/eastern-pacific.png"

          # CPAC is not always published as a separate graphical product.
          # Keep the last valid local copy rather than failing the whole job.
          if ! download_from_product_page \
            "https://www.nhc.noaa.gov/gtwo.php?basin=cpac" \
            "xgtwo_cpac_7d0.png" \
            "tropical/central-pacific.png"; then
            echo "No current CPAC graphic found; keeping existing CPAC image."
            rm -f tropical/central-pacific.png.tmp
          fi

      - name: Validate tropical graphics
        shell: bash
        run: |
          set -euo pipefail

          for image in tropical/atlantic.png tropical/eastern-pacific.png; do
            test -f "$image" || { echo "Missing required image: $image"; exit 1; }
            file "$image"
            file "$image" | grep -q "PNG image" || { echo "Invalid PNG: $image"; exit 1; }
          done

          if [ -f tropical/central-pacific.png ]; then
            file tropical/central-pacific.png
          else
            echo "No Central Pacific graphic is currently available."
          fi

      - name: Commit updated tropical graphics
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update tropical outlook graphics"
          file_pattern: tropical/*.png