name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  NHC_UA: "TRGTornado Weather Site/1.0"

jobs:
  update-tropics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download newest timestamped NHC outlooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tropical

          get_latest_issuance() {
            local basin="$1"
            local page="https://www.nhc.noaa.gov/archive/xgtwo/gtwo_archive_list.php?basin=${basin}&_=$(date +%s)"
            echo "Checking archive list: $page" >&2
            curl -L --fail --silent --show-error --retry 5 --retry-delay 2 \
              --connect-timeout 15 --max-time 90 -A "$NHC_UA" "$page" |
              grep -oE '20[0-9]{10}' | head -n1
          }

          download_png() {
            local url="$1"
            local output="$2"
            echo "Downloading: $url"
            curl -L --fail --silent --show-error --retry 5 --retry-delay 2 \
              --connect-timeout 15 --max-time 90 -A "$NHC_UA" \
              "$url" -o "$output.tmp"

            if ! file "$output.tmp" | grep -q "PNG image"; then
              echo "ERROR: response was not a PNG: $url"
              rm -f "$output.tmp"
              return 1
            fi

            if [ "$(stat -c%s "$output.tmp")" -lt 10000 ]; then
              echo "ERROR: PNG is suspiciously small: $url"
              rm -f "$output.tmp"
              return 1
            fi

            mv "$output.tmp" "$output"
            echo "Saved: $output"
          }

          # Atlantic graphics live under the Atlantic archive.
          atl="$(get_latest_issuance atl)"
          if [[ ! "$atl" =~ ^20[0-9]{10}$ ]]; then
            echo "Could not determine latest Atlantic issuance"
            exit 1
          fi
          echo "Latest Atlantic issuance: $atl"
          download_png \
            "https://www.nhc.noaa.gov/archive/xgtwo/atl/${atl}/xgtwo_atl_7d0.png" \
            "tropical/atlantic.png"

          # Eastern and Central Pacific graphics share the EPAC archive.
          epac="$(get_latest_issuance epac)"
          if [[ ! "$epac" =~ ^20[0-9]{10}$ ]]; then
            echo "Could not determine latest Pacific issuance"
            exit 1
          fi
          echo "Latest Pacific issuance: $epac"

          download_png \
            "https://www.nhc.noaa.gov/archive/xgtwo/epac/${epac}/xgtwo_pac_7d0.png" \
            "tropical/eastern-pacific.png"

          # CPAC uses the same timestamped EPAC archive directory.
          if ! download_png \
            "https://www.nhc.noaa.gov/archive/xgtwo/epac/${epac}/xgtwo_cpac_7d0.png" \
            "tropical/central-pacific.png"; then
            echo "CPAC graphic was not available for this issuance. Keeping the previous valid CPAC image."
            rm -f tropical/central-pacific.png.tmp
          fi

      - name: Validate tropical graphics
        shell: bash
        run: |
          set -euo pipefail
          for image in tropical/atlantic.png tropical/eastern-pacific.png; do
            test -f "$image"
            file "$image" | grep -q "PNG image"
          done
          if [ -f tropical/central-pacific.png ]; then
            file tropical/central-pacific.png | grep -q "PNG image"
          fi
          echo "Tropical graphics validated successfully."

      - name: Commit updated tropical graphics
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update tropical outlook graphics"
          file_pattern: tropical/*.png