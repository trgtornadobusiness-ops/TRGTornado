name: Update NHC Tropical Graphics

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current NHC graphics
        shell: bash
        run: |
          set -e
          mkdir -p assets/nhc
          curl -fL --retry 3 --retry-delay 2 'https://www.nhc.noaa.gov/archive/xgtwo/atl/latest/two_atl_7d0.png' -o assets/nhc/atl-7day.png
          curl -fL --retry 3 --retry-delay 2 'https://www.nhc.noaa.gov/archive/xgtwo/epac/latest/two_epac_7d0.png' -o assets/nhc/epac-7day.png
          curl -fL --retry 3 --retry-delay 2 'https://www.nhc.noaa.gov/archive/xgtwo/cpac/latest/two_cpac_7d0.png' -o assets/nhc/cpac-7day.png
      - name: Commit updated graphics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nhc/*.png
          if git diff --cached --quiet; then
            echo 'No NHC graphic changes.'
            exit 0
          fi
          git commit -m 'chore: update NHC tropical graphics'
          git push
