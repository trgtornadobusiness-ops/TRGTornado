name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-tropics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download official NHC archive stills
        shell: bash
        run: |
          set -u
          mkdir -p tropical
          download() {
            local url="$1" out="$2"
            echo "Trying $url"
            if curl -L --fail --silent --show-error --retry 5 --retry-delay 2 -A "TRGTornado Weather Site/1.0" -H "Cache-Control: no-cache" "$url" -o "$out.tmp"; then
              if file "$out.tmp" | grep -q "PNG image" && [ "$(stat -c%s "$out.tmp")" -gt 10000 ]; then
                mv "$out.tmp" "$out"
                echo "Valid PNG saved: $out"
                return 0
              fi
            fi
            rm -f "$out.tmp"
            echo "Unavailable: $url"
            return 1
          }

          # NHC's maintained /archive/xgtwo/.../latest/ product directories.
          # These are the official still graphics used by the Graphical Tropical Weather Outlook.
          download "https://www.nhc.noaa.gov/archive/xgtwo/atl/latest/xgtwo_atl_7d0.png" tropical/atlantic.png || true
          download "https://www.nhc.noaa.gov/archive/xgtwo/epac/latest/xgtwo_pac_7d0.png" tropical/eastern-pacific.png || true
          download "https://www.nhc.noaa.gov/archive/xgtwo/epac/latest/xgtwo_cpac_7d0.png" tropical/central-pacific.png || true

          echo "Official NHC archive download pass complete."

      - name: Validate available graphics
        shell: bash
        run: |
          set -u
          for image in tropical/*.png; do
            [ -s "$image" ] || continue
            if file "$image" | grep -q 'PNG image'; then
              echo "Valid PNG: $image"
            fi
          done
          exit 0

      - name: Commit graphics if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update official NHC tropical stills"
          file_pattern: tropical/*.png
