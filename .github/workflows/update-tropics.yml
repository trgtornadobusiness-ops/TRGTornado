name: Update NHC Tropical Graphics

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current NHC graphics
        shell: bash
        run: |
          set +e
          mkdir -p assets/nhc
          stamp=$(date +%s)
          for item in "atl atl" "epac epac" "cpac cpac"; do
            set -- $item
            basin=$1
            file=$2
            url="https://prod-east-nhc.woc.noaa.gov/archive/xgtwo/${basin}/latest/two_${file}_7d0.png?cache=${stamp}"
            echo "Updating ${basin}: ${url}"
            curl -fL --retry 4 --retry-delay 2 -H 'Cache-Control: no-cache' "$url" -o "assets/nhc/${basin}-7day.png.tmp"
            if [ $? -eq 0 ] && [ -s "assets/nhc/${basin}-7day.png.tmp" ]; then
              mv "assets/nhc/${basin}-7day.png.tmp" "assets/nhc/${basin}-7day.png"
            else
              rm -f "assets/nhc/${basin}-7day.png.tmp"
              echo "${basin} download failed; keeping last known-good image."
            fi
          done
      - name: Commit updated graphics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nhc/*.png
          if git diff --cached --quiet; then
            echo 'No NHC graphic changes.'
            exit 0
          fi
          git commit -m 'chore: update NHC tropical graphics'
          git push
