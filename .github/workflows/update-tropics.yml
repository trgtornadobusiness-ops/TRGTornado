name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-tropics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download current NHC stills
        shell: bash
        run: |
          set -u
          mkdir -p tropical
          changed=0
          download() {
            url="$1"; out="$2"
            echo "Trying $url"
            if curl -L --fail --silent --show-error --retry 3 -A "TRGTornado/1.0" -H "Cache-Control: no-cache" "$url" -o "$out.tmp"; then
              if file "$out.tmp" | grep -q "PNG image" && [ "$(stat -c%s "$out.tmp")" -gt 10000 ]; then
                if [ ! -f "$out" ] || ! cmp -s "$out.tmp" "$out"; then changed=1; fi
                mv "$out.tmp" "$out"; echo "Valid PNG saved: $out"; return 0
              fi
            fi
            rm -f "$out.tmp"; return 1
          }
          download "https://www.nhc.noaa.gov/xgtwo/images/xgtwo_atl_7d0.png" tropical/atlantic.png || echo "Atlantic download unavailable; preserving existing file."
          download "https://www.nhc.noaa.gov/xgtwo/images/xgtwo_pac_7d0.png" tropical/eastern-pacific.png || echo "EPAC download unavailable; preserving existing file."
          download "https://www.nhc.noaa.gov/xgtwo/images/xgtwo_cpac_7d0.png" tropical/central-pacific.png || echo "CPAC unavailable; preserving existing file."
          echo "Downloader finished; unavailable products never fail the job."

      - name: Validate existing graphics
        shell: bash
        run: |
          set -u
          for image in tropical/*.png; do
            [ -s "$image" ] || { echo "Skipping empty $image"; rm -f "$image"; continue; }
            file "$image" | grep -q 'PNG image' || { echo "Skipping invalid $image"; rm -f "$image"; }
          done
          echo "Validation complete."

      - name: Commit graphics if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update tropical outlook graphics"
          file_pattern: tropical/*.png
