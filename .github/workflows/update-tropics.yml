name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-tropics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download newest NHC archive stills
        shell: bash
        run: |
          set -u
          mkdir -p tropical

          get_image() {
            local basin="$1" filename="$2" output="$3"
            local urls=(
              "https://www.nhc.noaa.gov/archive/xgtwo/${basin}/latest/${filename}"
              "https://www.nhc.noaa.gov/xgtwo/images/${filename}"
            )
            local url
            for url in "${urls[@]}"; do
              echo "Trying current NHC product: $url"
              if curl -L --fail --silent --show-error --retry 5 --retry-delay 2 \
                -A 'TRGTornado Weather Site/1.0' -H 'Cache-Control: no-cache' \
                "$url" -o "$output.tmp"; then
                if file "$output.tmp" | grep -q 'PNG image' && [ "$(stat -c%s "$output.tmp")" -gt 10000 ]; then
                  mv "$output.tmp" "$output"
                  echo "Saved current PNG: $output"
                  return 0
                fi
              fi
              rm -f "$output.tmp"
            done
            echo "No current PNG source succeeded for $filename"
            return 1
          }

          # NHC's current archive uses these exact 7-day still products.
          get_image atl xgtwo_atl_7d0.png tropical/atlantic.png || true
          get_image epac xgtwo_pac_7d0.png tropical/eastern-pacific.png || true
          get_image cpac xgtwo_cpac_7d0.png tropical/central-pacific.png || true
          echo "NHC archive update pass complete."

      - name: Validate available graphics
        shell: bash
        run: |
          set -u
          found=0
          for image in tropical/*.png; do
            [ -s "$image" ] || continue
            if file "$image" | grep -q 'PNG image'; then
              echo "Valid PNG: $image"
              found=1
            fi
          done
          echo "Graphics found: $found"
          exit 0

      - name: Commit graphics if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update current NHC tropical graphics"
          file_pattern: tropical/*.png
