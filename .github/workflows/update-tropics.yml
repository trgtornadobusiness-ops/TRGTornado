name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-tropics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download latest NHC stills
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tropical

          download_nhc() {
            local basin="$1" output="$2"
            local base="https://www.nhc.noaa.gov/archive/xgtwo/${basin}/latest"
            local image="two_${basin}_7d0.png"
            local url="${base}/${image}"
            echo "Downloading NHC ${basin}: ${url}"
            if curl -L --fail --silent --show-error --retry 5 --retry-delay 2 --connect-timeout 15 --max-time 60 -A 'TRGTornado Weather Site/1.0' -H 'Cache-Control: no-cache' "${url}?_=$(date +%s)" -o "${output}.tmp"; then
              if file "${output}.tmp" | grep -q 'PNG image' && [ "$(stat -c%s "${output}.tmp")" -gt 10000 ]; then
                mv "${output}.tmp" "${output}"
                echo "Saved fresh NHC graphic: ${output}"
                return 0
              fi
            fi
            rm -f "${output}.tmp"
            echo "NHC ${basin} download failed; preserving previous good image if one exists."
            return 1
          }

          # Only this workflow and the tropical assets are touched. The rest of
          # the website is completely independent of this update process.
          download_nhc atl tropical/atlantic.png || true
          download_nhc epac tropical/eastern-pacific.png || true
          download_nhc cpac tropical/central-pacific.png || true

      - name: Validate tropical graphics
        shell: bash
        run: |
          set -u
          for image in tropical/atlantic.png tropical/eastern-pacific.png tropical/central-pacific.png; do
            if [ -s "$image" ] && file "$image" | grep -q 'PNG image'; then
              echo "Valid PNG: $image"
            else
              echo "No new valid PNG for $image (an existing good file may be absent)."
            fi
          done
          exit 0

      - name: Commit graphics if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update current NHC tropical graphics"
          file_pattern: tropical/*.png
