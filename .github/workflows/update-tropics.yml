name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update-tropics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download newest NHC archive stills
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tropical

          get_image() {
            local basin="$1" product="$2" output="$3"
            local page="https://www.nhc.noaa.gov/archive/xgtwo/gtwo_archive.php?basin=${basin}&current_issuance=latest&fdays=7"
            echo "Reading latest NHC ${basin} archive: ${page}"
            local html path url
            html="$(curl -L --fail --silent --show-error --retry 5 --retry-delay 2 -A 'TRGTornado Weather Site/1.0' -H 'Cache-Control: no-cache' "$page")"
            path="$(printf '%s' "$html" | grep -oE '[A-Za-z0-9_./-]*'"${product}"'[A-Za-z0-9_./-]*' | head -n 1 || true)"
            if [ -z "$path" ]; then
              echo "Could not find ${product} in latest NHC archive page for ${basin}"
              return 1
            fi
            if [[ "$path" =~ ^https?:// ]]; then url="$path"; else url="https://www.nhc.noaa.gov/${path#/}"; fi
            echo "Downloading current NHC image: $url"
            curl -L --fail --silent --show-error --retry 5 --retry-delay 2 -A 'TRGTornado Weather Site/1.0' -H 'Cache-Control: no-cache' "$url" -o "$output.tmp"
            if ! file "$output.tmp" | grep -q 'PNG image' || [ "$(stat -c%s "$output.tmp")" -le 10000 ]; then
              echo "Downloaded file is not a valid current PNG: $output.tmp"
              rm -f "$output.tmp"
              return 1
            fi
            mv "$output.tmp" "$output"
            echo "Saved current NHC graphic: $output"
          }

          # The archive page is used to discover the newest issuance instead of
          # assuming the /latest/ directory keeps a stable image filename.
          get_image atl two_atl_7d0.png tropical/atlantic.png || true
          get_image epac two_epac_7d0.png tropical/eastern-pacific.png || true
          get_image cpac two_cpac_7d0.png tropical/central-pacific.png || true
          echo "NHC archive update pass complete."

      - name: Validate available graphics
        shell: bash
        run: |
          set -u
          found=0
          for image in tropical/*.png; do
            [ -s "$image" ] || continue
            if file "$image" | grep -q 'PNG image'; then
              echo "Valid PNG: $image"
              found=1
            fi
          done
          echo "Graphics found: $found"
          exit 0

      - name: Commit graphics if changed
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update current NHC tropical graphics"
          file_pattern: tropical/*.png
