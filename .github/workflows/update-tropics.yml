name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

env:
  NHC_UA: "TRGTornado Weather Site/1.0"

jobs:
  update-tropics:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download current NHC still images
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tropical

          download_current() {
            local basin="$1" filename="$2" output="$3"
            local page="https://www.nhc.noaa.gov/archive/xgtwo/gtwo_archive.php?basin=${basin}&current_issuance=latest&fdays=7&v=$(date +%s)"
            local html image_url
            echo "Reading official NHC archive page: $page"
            html="$(curl --location --fail --silent --show-error --retry 5 -A "$NHC_UA" -H 'Cache-Control: no-cache' "$page")"

            image_url="$(printf '%s' "$html" | grep -oE 'href="[^"]*'"$filename"'[^"]*"' | sed -E 's/^href="//;s/"$//' | head -1 || true)"
            if [ -z "$image_url" ]; then
              image_url="$(printf '%s' "$html" | grep -oE 'src="[^"]*'"$filename"'[^"]*"' | sed -E 's/^src="//;s/"$//' | head -1 || true)"
            fi
            if [ -z "$image_url" ]; then
              echo "Could not find $filename on the official NHC archive page"
              return 1
            fi

            case "$image_url" in
              http://*|https://*) ;;
              /*) image_url="https://www.nhc.noaa.gov${image_url}" ;;
              *) image_url="https://www.nhc.noaa.gov/${image_url}" ;;
            esac

            echo "Downloading current product: $image_url"
            if ! curl --location --fail --silent --show-error --retry 5 -A "$NHC_UA" -H 'Cache-Control: no-cache' "$image_url" -o "$output.tmp"; then
              rm -f "$output.tmp"
              return 1
            fi
            if ! file "$output.tmp" | grep -q 'PNG image'; then
              rm -f "$output.tmp"
              return 1
            fi
            if [ "$(stat -c%s "$output.tmp")" -lt 10000 ]; then
              rm -f "$output.tmp"
              return 1
            fi
            mv "$output.tmp" "$output"
            echo "Saved: $output"
          }

          # Current official NHC products. Do not use /latest/ image URLs.
          download_current atl xgtwo_atl_7d0.png tropical/atlantic.png
          download_current epac xgtwo_pac_7d0.png tropical/eastern-pacific.png

          # CPAC does not always have a separate 7-day PNG. Never fail the job for it.
          if ! download_current epac xgtwo_cpac_7d0.png tropical/central-pacific.png; then
            echo "CPAC 7-day PNG is not currently published; leaving any existing file untouched."
            rm -f tropical/central-pacific.png.tmp
          fi

      - name: Validate graphics
        shell: bash
        run: |
          set -euo pipefail
          for image in tropical/atlantic.png tropical/eastern-pacific.png; do
            test -s "$image"
            file "$image" | grep -q 'PNG image'
          done
          if [ -f tropical/central-pacific.png ]; then
            file tropical/central-pacific.png | grep -q 'PNG image'
          fi

      - name: Commit current graphics
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Auto-update current NHC tropical stills"
          file_pattern: tropical/*.png

# v54.1: intentionally no hard dependency on a CPAC PNG because NHC may not publish one.
