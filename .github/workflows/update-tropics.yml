name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tropics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Download current NHC tropical outlooks
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tropical

          download_png() {
            local output="$1"
            shift
            for url in "$@"; do
              echo "Trying: $url"
              if curl -L --fail --silent --show-error --retry 5 --retry-delay 3 \
                --connect-timeout 15 --max-time 60 \
                -A "TRGTornado Weather Site/1.0" "$url" -o "$output.tmp"; then
                if file "$output.tmp" | grep -q "PNG image"; then
                  mv "$output.tmp" "$output"
                  echo "Successfully saved: $output"
                  return 0
                fi
              fi
              rm -f "$output.tmp"
            done
            echo "ERROR: Could not download a valid PNG for $output"
            return 1
          }

          # NHC's current Atlantic and Eastern Pacific graphical outlooks.
          download_png tropical/atlantic.png \
            "https://www.nhc.noaa.gov/archive/xgtwo/atl/latest/xgtwo_atl_7d0.png"

          download_png tropical/eastern-pacific.png \
            "https://www.nhc.noaa.gov/archive/xgtwo/epac/latest/xgtwo_pac_7d0.png"

          # Central Pacific is published inside NHC's EPAC archive directory.
          # The old /cpac/latest/ path returns 404.
          if ! download_png tropical/central-pacific.png \
            "https://www.nhc.noaa.gov/archive/xgtwo/epac/latest/xgtwo_cpac_7d0.png"; then
            echo "Central Pacific graphic is unavailable right now; keeping any existing file."
            rm -f tropical/central-pacific.png.tmp
          fi

      - name: Validate tropical graphics
        shell: bash
        run: |
          set -euo pipefail

          for image in tropical/atlantic.png tropical/eastern-pacific.png; do
            test -f "$image" || { echo "Missing required image: $image"; exit 1; }
            file "$image"
            file "$image" | grep -q "PNG image" || { echo "Invalid PNG: $image"; exit 1; }
          done

          if [ -f tropical/central-pacific.png ]; then
            file tropical/central-pacific.png
          else
            echo "No Central Pacific graphic is currently available."
          fi

      - name: Commit updated tropical graphics
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update tropical outlook graphics"
          file_pattern: tropical/*.png