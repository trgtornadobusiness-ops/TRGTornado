name: Update NHC Tropical Graphics

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download current NHC graphical outlooks
        shell: bash
        run: |
          set +e
          mkdir -p assets/nhc
          stamp=$(date +%s)
          for basin in atl epac cpac; do
            ok=1
            for host in https://prod-west-nhc.woc.noaa.gov https://prod-east-nhc.woc.noaa.gov https://www.nhc.noaa.gov; do
              url="${host}/archive/xgtwo/${basin}/latest/xgtwo_${basin}_7d0.png?cache=${stamp}"
              echo "Updating ${basin}: ${url}"
              curl -fL --retry 4 --retry-delay 2 --connect-timeout 15 --max-time 60 -H 'Cache-Control: no-cache' "$url" -o "assets/nhc/${basin}-7day.png.tmp"
              if [ $? -eq 0 ] && [ -s "assets/nhc/${basin}-7day.png.tmp" ]; then
                mv "assets/nhc/${basin}-7day.png.tmp" "assets/nhc/${basin}-7day.png"
                ok=0
                break
              fi
              rm -f "assets/nhc/${basin}-7day.png.tmp"
            done
            if [ $ok -ne 0 ]; then echo "${basin} download failed; keeping last known-good image."; fi
          done
      - name: Commit updated graphics
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/nhc/*.png
          if git diff --cached --quiet; then
            echo 'No NHC graphic changes.'
            exit 0
          fi
          git commit -m 'chore: update NHC tropical graphics'
          git push
