name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  NHC_UA: "TRGTornado Weather Site/1.0"

jobs:
  update-tropics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Find newest NHC outlook and download graphics
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p tropical

          latest_archive() {
            local basin="$1"
            local index="https://www.nhc.noaa.gov/archive/xgtwo/${basin}/"
            curl -L --fail --silent --show-error --retry 5 --retry-delay 3 \
              --connect-timeout 15 --max-time 60 -A "$NHC_UA" "$index" \
              | grep -oE 'href="[0-9]{12}/"' \
              | sed -E 's/href="([0-9]{12})\/"/\1/' \
              | sort -nr | head -n1
          }

          download_png() {
            local output="$1"
            local url="$2"
            echo "Downloading: $url"
            curl -L --fail --silent --show-error --retry 5 --retry-delay 3 \
              --connect-timeout 15 --max-time 90 -A "$NHC_UA" "$url" -o "$output.tmp"
            if ! file "$output.tmp" | grep -q "PNG image"; then
              echo "Downloaded response is not a PNG: $url"
              rm -f "$output.tmp"
              return 1
            fi
            if [ "$(stat -c%s "$output.tmp")" -lt 1000 ]; then
              echo "Downloaded PNG is suspiciously small: $url"
              rm -f "$output.tmp"
              return 1
            fi
            mv "$output.tmp" "$output"
            echo "Saved: $output"
          }

          # Do not trust the /latest/ directory. It can lag behind the actual
          # NHC archive. Find the newest timestamped outlook directory instead.
          ATL_DIR="$(latest_archive atl)"
          EPAC_DIR="$(latest_archive epac)"

          if [ -z "$ATL_DIR" ] || [ -z "$EPAC_DIR" ]; then
            echo "Could not determine the newest NHC outlook directory."
            exit 1
          fi

          echo "Newest Atlantic outlook: $ATL_DIR"
          echo "Newest Pacific outlook: $EPAC_DIR"

          ATL_BASE="https://www.nhc.noaa.gov/archive/xgtwo/atl/${ATL_DIR}"
          EPAC_BASE="https://www.nhc.noaa.gov/archive/xgtwo/epac/${EPAC_DIR}"

          download_png tropical/atlantic.png \
            "${ATL_BASE}/xgtwo_atl_7d0.png"

          download_png tropical/eastern-pacific.png \
            "${EPAC_BASE}/xgtwo_pac_7d0.png"

          # CPAC is published alongside EPAC in the same archive.
          if ! download_png tropical/central-pacific.png \
            "${EPAC_BASE}/xgtwo_cpac_7d0.png"; then
            echo "CPAC graphic unavailable in the newest EPAC archive; keeping existing CPAC file."
            rm -f tropical/central-pacific.png.tmp
          fi

      - name: Validate tropical graphics
        shell: bash
        run: |
          set -euo pipefail

          for image in tropical/atlantic.png tropical/eastern-pacific.png; do
            test -f "$image" || { echo "Missing required image: $image"; exit 1; }
            file "$image"
            file "$image" | grep -q "PNG image" || { echo "Invalid PNG: $image"; exit 1; }
          done

          if [ -f tropical/central-pacific.png ]; then
            file tropical/central-pacific.png
          else
            echo "No Central Pacific graphic is currently available."
          fi

      - name: Commit updated tropical graphics
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "Update tropical outlook graphics"
          file_pattern: tropical/*.png