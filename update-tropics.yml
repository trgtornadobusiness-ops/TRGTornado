name: Update Tropical Outlooks

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-tropics:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare tropical folder
        run: mkdir -p tropical

      - name: Download Atlantic outlook
        run: |
          curl -L --fail --silent --show-error \
            -A "Mozilla/5.0" \
            "https://www.nhc.noaa.gov/xgtwo/resize/xgtwo_atl_7d0_w1366.png" \
            -o /tmp/atlantic.png

          if file /tmp/atlantic.png | grep -q "PNG image"; then
            mv /tmp/atlantic.png tropical/atlantic.png
            echo "Atlantic outlook updated."
          else
            echo "Atlantic download was not a PNG. Keeping previous image."
          fi

      - name: Download Eastern Pacific outlook
        run: |
          curl -L --fail --silent --show-error \
            -A "Mozilla/5.0" \
            "https://www.nhc.noaa.gov/xgtwo/resize/xgtwo_pac_7d0_w1366.png" \
            -o /tmp/eastern-pacific.png

          if file /tmp/eastern-pacific.png | grep -q "PNG image"; then
            mv /tmp/eastern-pacific.png tropical/eastern-pacific.png
            echo "Eastern Pacific outlook updated."
          else
            echo "Eastern Pacific download was not a PNG. Keeping previous image."
          fi

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet -- tropical/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit updated tropical outlooks
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add tropical/
          git commit -m "Update tropical outlooks"
          git push
